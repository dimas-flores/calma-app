<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calma</title>
    <style>
        body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;margin:0;padding:20px}
        .box{background:#fff;padding:40px;border-radius:20px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        h1{color:#667eea;text-align:center;margin:0 0 10px;font-size:32px}
        .subtitle{text-align:center;color:#666;margin-bottom:30px;font-size:14px}
        .form-group{margin-bottom:20px}
        label{display:block;margin-bottom:8px;color:#333;font-weight:500;font-size:14px}
        input{width:100%;padding:12px 15px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;box-sizing:border-box}
        input:focus{outline:none;border-color:#667eea}
        button{width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
        button:hover{transform:translateY(-2px);transition:.2s}
        .toggle-link{text-align:center;margin-top:20px;color:#666;font-size:14px}
        .toggle-link a{color:#667eea;text-decoration:none;font-weight:600;cursor:pointer}
        .message{padding:12px;border-radius:8px;margin-bottom:20px;font-size:14px;text-align:center}
        .success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
        .error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
        .hidden{display:none}
        .dashboard{text-align:center}
        .dashboard h2{color:#667eea;margin-bottom:20px}
        .dashboard p{color:#666;margin-bottom:30px}
        .btn-secondary{background:#6c757d}
    </style>
</head>
<body>
    <div class="box">
        <div id="authScreen">
            <h1>🧠 Calma</h1>
            <p class="subtitle">Tu bienestar emocional en tus manos</p>
            <div id="message"></div>

            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" id="regNombre" required>
                </div>
                <div class="form-group">
                    <label>Edad</label>
                    <input type="number" id="regEdad" required>
                </div>
                <div class="form-group">
                    <label>Profesión (opcional)</label>
                    <input type="text" id="regProfesion">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" required>
                </div>
                <button type="submit">Registrarse</button>
                <div class="toggle-link">
                    ¿Ya tienes cuenta? <a onclick="toggleForms()">Inicia sesión</a>
                </div>
            </form>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit">Iniciar Sesión</button>
                <div class="toggle-link">
                    ¿No tienes cuenta? <a onclick="toggleForms()">Regístrate</a>
                </div>
            </form>
        </div>

        <div id="dashboardScreen" class="hidden dashboard">
            <h2>¡Bienvenido, <span id="userName"></span>! 👋</h2>
            <p>¿Cómo te sientes hoy?</p>
            <button onclick="alert('¡Cuestionario próximamente!')">Ayudáme a escoger</button>
            <button class="btn-secondary" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        // URL de la API actualizada para reflejar el puerto 3001
        const API_URL='http://localhost:3001/api';

        // Variables para almacenar el usuario y token actuales
        let currentUser=null,token=null;

        // Función para alternar entre los formularios de registro e inicio de sesión
        function toggleForms(){
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
            document.getElementById('message').innerHTML='';
        }

        function showMessage(text,type){
            document.getElementById('message').innerHTML=`<div class="message ${type}">${text}</div>`;
        }

        document.getElementById('registerForm').addEventListener('submit',async(e)=>{
            e.preventDefault();
            const data={
                nombre:document.getElementById('regNombre').value,
                edad:parseInt(document.getElementById('regEdad').value),
                profesion:document.getElementById('regProfesion').value,
                email:document.getElementById('regEmail').value,
                password:document.getElementById('regPassword').value
            };
            try{
                const response=await fetch(`${API_URL}/auth/register`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(data)
                });
                const result=await response.json();
                if(response.ok){
                    token=result.token;
                    currentUser=result.user;
                    showDashboard();
                }else{
                    showMessage(result.error||'Error al registrar','error');
                }
            }catch(error){
                showMessage('Error de conexión. Verifica que el backend esté corriendo en puerto 3001','error');
            }
        });

        document.getElementById('loginForm').addEventListener('submit',async(e)=>{
            e.preventDefault();
            const data={
                email:document.getElementById('loginEmail').value,
                password:document.getElementById('loginPassword').value
            };
            try{
                const response=await fetch(`${API_URL}/auth/login`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(data)
                });
                const result=await response.json();
                if(response.ok){
                    token=result.token;
                    currentUser=result.user;
                    showDashboard();
                }else{
                    showMessage(result.error||'Error al iniciar sesión','error');
                }
            }catch(error){
                showMessage('Error de conexión. Verifica que el backend esté corriendo en puerto 3001','error');
            }
        });

        function showDashboard(){
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('userName').textContent=currentUser.nombre;
        }

        function logout(){
            token=null;
            currentUser=null;
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
        }
    </script>
</body>
</html>
